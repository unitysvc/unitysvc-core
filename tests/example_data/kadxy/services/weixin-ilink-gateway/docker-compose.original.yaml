# The project's own docker-compose.yaml as the issue describes it: it fails the platform's policy
# in four places (unpinned tag, env_file, host port mapping, no healthcheck). A negative test.
services:
  gateway:
    image: ghcr.io/kadxy/weixin-ilink-gateway:latest
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped
volumes:
  gateway-data:
